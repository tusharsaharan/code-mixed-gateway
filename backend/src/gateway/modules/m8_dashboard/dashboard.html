<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code-Mixed Gateway — Pilot Dashboard</title>
    <style>
      :root {
        --ink: #1f2430;
        --mut: #6b7280;
        --card: #ffffff;
        --bg: #f6f4ef;
        --accent: #0f766e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 24px 28px;
        border-bottom: 1px solid #e5e1d8;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p.sub {
        margin: 4px 0 0;
        color: var(--mut);
      }
      main {
        padding: 24px 28px;
        display: grid;
        gap: 18px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid #e5e1d8;
        border-radius: 12px;
        padding: 16px;
      }
      .card .k {
        color: var(--mut);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .card .v {
        font-size: 26px;
        font-weight: 650;
        margin-top: 6px;
      }
      .panel {
        background: var(--card);
        border: 1px solid #e5e1d8;
        border-radius: 12px;
        padding: 18px;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 15px;
        color: var(--mut);
        font-weight: 600;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 7px 10px;
        border-bottom: 1px solid #eee9df;
      }
      th {
        color: var(--mut);
        font-weight: 600;
      }
      .bar {
        height: 14px;
        border-radius: 7px;
        background: var(--accent);
      }
      .bar-row td {
        padding: 6px 10px;
      }
      svg text {
        font-size: 11px;
        fill: var(--mut);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Code-Mixed Gateway — Live Pilot</h1>
      <p class="sub">Hinglish compression + conformal cascade · queries from the Telegram bot</p>
    </header>
    <main>
      <section class="cards" id="cards"></section>
      <section class="panel">
        <h2>Tier split</h2>
        <div id="tiers"></div>
      </section>
      <section class="panel">
        <h2>Cost savings over time (USD / hour)</h2>
        <svg
          id="series"
          width="100%"
          height="180"
          viewBox="0 0 900 180"
          preserveAspectRatio="xMidYMid meet"
        ></svg>
      </section>
      <section class="panel">
        <h2>Recent queries</h2>
        <table id="recent">
          <thead>
            <tr>
              <th>user</th>
              <th>orig</th>
              <th>comp</th>
              <th>model</th>
              <th>savings $</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
    <script>
      async function load() {
        const stats = await (await fetch("/v1/dashboard/stats")).json();
        const series = await (await fetch("/v1/dashboard/series")).json();
        const recent = await (await fetch("/v1/dashboard/recent?limit=15")).json();
        const cards = [
          ["queries", stats.queries],
          ["tokens saved", stats.total_original_tokens - stats.total_compressed_tokens],
          ["savings INR", "₹" + stats.total_cost_savings_inr.toFixed(2)],
          ["tier split", Object.keys(stats.tier_split).length],
        ];
        document.getElementById("cards").innerHTML = cards
          .map(
            (c) =>
              `<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`,
          )
          .join("");

        const tiers = stats.tier_split || {};
        const total = Object.values(tiers).reduce((a, b) => a + b, 0) || 1;
        document.getElementById("tiers").innerHTML = Object.entries(tiers)
          .map(
            ([k, v]) =>
              `<table class="bar-row"><tr><td style="width:120px">${k}</td>` +
              `<td><div class="bar" style="width:${Math.max(2, (v / total) * 100)}%"></div></td>` +
              `<td style="width:48px;text-align:right">${v}</td></tr></table>`,
          )
          .join("");

        const pts = series || [];
        const svgEl = document.getElementById("series");
        const vbW = 900,
          vbH = 180,
          pad = 12;
        const max = Math.max(1, ...pts.map((p) => p.savings_usd));
        // Background grid + bars; timestamps formatted; handles single-point and empty cases
        let svg = `<rect x="0" y="0" width="${vbW}" height="${vbH}" fill="#fbfaf7" rx="10"/>`;
        if (pts.length === 0) {
          svg += `<text x="${vbW / 2}" y="${vbH / 2}" text-anchor="middle" font-size="12">no queries yet — try the demo</text>`;
        } else {
          pts.forEach((p, i) => {
            const x = pad + i * ((vbW - 2 * pad) / Math.max(1, pts.length - 1));
            const barH = (p.savings_usd / max) * (vbH - 40);
            const y = vbH - 18 - barH;
            const label = new Date(p.bucket * 1000).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
            });
            svg += `<rect x="${x - 4}" y="${y}" width="8" height="${barH}" rx="3" fill="#0f766e"/>`;
            if (pts.length <= 12)
              svg += `<text x="${x}" y="${vbH - 4}" text-anchor="middle" font-size="9">${label}</text>`;
          });
        }
        svgEl.innerHTML = svg;

        const rows = recent
          .map(
            (r) =>
              `<tr><td>${r.user_id}</td><td>${r.original_tokens}</td><td>${r.compressed_tokens}</td>` +
              `<td>${r.model_routed}</td><td>${r.estimated_cost_savings.toFixed(6)}</td></tr>`,
          )
          .join("");
        document.querySelector("#recent tbody").innerHTML =
          rows || '<tr><td colspan="5">no queries yet</td></tr>';
      }
      load().catch((e) =>
        document.body.insertAdjacentHTML("beforeend", "<p>dashboard error: " + e + "</p>"),
      );
      setInterval(load, 30000);
    </script>
  </body>
</html>

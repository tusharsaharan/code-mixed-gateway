[project]
name = "code-mixed-gateway"
version = "0.1.0"
description = "Open code-mixed (Hinglish) prompt compression & conformally-calibrated cascade gateway"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tenacity>=8.3",
]

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.7", "tokenizers>=0.19"]
eval = ["sacrebleu>=2.4", "rouge-score>=0.1.2"]
telegram = ["python-telegram-bot>=21.0"]
hf = ["datasets>=2.19", "pandas>=2.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pytest-cov>=5",
    "sacrebleu>=2.4",
    "rouge-score>=0.1.2",
]

[project.scripts]
cg-gateway = "gateway.modules.m5_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/gateway/modules/m1_pipeline/pipeline.py" = ["E501"]
"src/gateway/modules/m1_pipeline/hinglish.py" = ["E501"]
"src/gateway/modules/m7_eval/export_hf.py" = ["E501"]